<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Measurement Token</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @page {
            size: A5;
            margin: 8mm;
        }

        @media print {
            .no-print {
                display: none !important;
            }

            body {
                background: white !important;
            }

            .print-card {
                box-shadow: none !important;
                border: 1px dashed #000 !important;
            }
        }
    </style>
</head>

<body class="bg-gray-100 py-6">

<div class="max-w-xl mx-auto px-4">

    <!-- Actions -->
    <div class="no-print flex justify-end mb-4">
        <button onclick="window.print()"
                class="bg-blue-600 text-white px-4 py-2 rounded-lg">
            Print / Save PDF
        </button>
    </div>

    <!-- Token -->
    <div class="print-card bg-white border-2 border-dashed border-gray-400 p-6 rounded-xl">

        <!-- Header -->
        <div class="flex justify-between items-center border-b pb-3 mb-4">
            <div>
                <h1 class="text-xl font-bold">MEASUREMENT TOKEN</h1>
                <p class="text-sm text-gray-500">Tailor Shop</p>
            </div>

            <div class="text-right">
                <p class="text-sm">Token No</p>
                <p class="font-bold text-lg" th:text="${tokenNo}">MT-00001</p>
            </div>
        </div>

        <!-- Customer Info -->
        <div class="mb-4 text-sm">
            <p><strong>Customer:</strong>
                <span th:text="${measurement.customer != null ? measurement.customer.name : ''}"></span>
            </p>

            <p><strong>Phone:</strong>
                <span th:text="${measurement.customer != null ? measurement.customer.phone : ''}"></span>
            </p>

            <p><strong>Type:</strong>
                <span th:text="${measurement.measurementType}"></span>
            </p>
        </div>

        <!-- Measurements -->
        <div class="grid grid-cols-2 gap-3 text-sm">

            <p>Shoulder: <span th:text="${measurement.shoulder}"></span></p>
            <p>Chest: <span th:text="${measurement.chest}"></span></p>
            <p>Waist: <span th:text="${measurement.waist}"></span></p>
            <p>Hip: <span th:text="${measurement.hip}"></span></p>
            <p>Sleeve: <span th:text="${measurement.sleeveLength}"></span></p>
            <p>Length: <span th:text="${measurement.shirtLength}"></span></p>
            <p>Pant: <span th:text="${measurement.pantLength}"></span></p>

            <!-- Male -->
            <p th:if="${measurement.neck != null}">
                Neck: <span th:text="${measurement.neck}"></span>
            </p>

            <!-- Female -->
            <p th:if="${measurement.bust != null}">
                Bust: <span th:text="${measurement.bust}"></span>
            </p>

            <p th:if="${measurement.underBust != null}">
                Under Bust: <span th:text="${measurement.underBust}"></span>
            </p>

        </div>

        <!-- Notes -->
        <div class="mt-4 text-sm" th:if="${measurement.notes != null}">
            <p><strong>Notes:</strong></p>
            <p th:text="${measurement.notes}"></p>
        </div>

        <!-- Footer -->
        <div class="mt-6 flex justify-between text-xs">
            <span>Staff Signature: __________</span>
            <span>Date: __________</span>
        </div>

    </div>
</div>

</body>
</html>
