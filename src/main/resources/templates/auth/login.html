<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center">

<div class="w-full max-w-md">

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">

        <!-- Header -->
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-800">Welcome Back</h2>
            <p class="text-sm text-slate-500 mt-1">
                Sign in Sun Moon Tailor Management System
            </p>
        </div>

        <!-- Form -->
        <form th:action="@{/login}" method="post" class="space-y-5">

            <!-- Username -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                <input type="text" name="username" required
                       placeholder="Enter your username"
                       class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" name="password" required
                       placeholder="Enter your password"
                       class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Error Message -->
            <div th:if="${param.error}"
                 class="rounded-xl bg-rose-50 border border-rose-200 px-4 py-3 text-sm text-rose-600">
                Invalid username or password
            </div>

            <!-- Submit -->
            <button type="submit"
                    class="w-full rounded-xl bg-blue-600 px-4 py-2.5 text-white font-medium shadow hover:bg-blue-700 transition">
                Login
            </button>

        </form>

        <!-- Footer -->
        <div class="mt-6 text-center text-xs text-slate-400">
            © Tailor Shop Management System
        </div>

    </div>

</div>

</body>
</html>
