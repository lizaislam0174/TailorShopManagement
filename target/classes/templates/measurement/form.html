<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Measurement Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="ml-64 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">

        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">Measurement Form</h1>
                <p class="text-sm text-slate-500 mt-1">
                    Create and manage customer measurements for tailoring.
                </p>
            </div>

            <div class="flex gap-3">
                <button type="submit"
                        class="rounded-xl bg-blue-600 px-6 py-2.5 text-white font-medium shadow hover:bg-blue-700 transition">
                    Save Measurement
                </button>
                <a th:if="${measurement.id != null}"
                   th:href="@{/measurements/token/{id}(id=${measurement.id})}"
                   target="_blank" rel="noopener noreferrer"
                   class="inline-flex items-center rounded-xl bg-emerald-600 px-4 py-2 text-white font-medium shadow hover:bg-emerald-700 transition">
                    View Token
                </a>

                <a th:href="@{/measurements}"
                   class="inline-flex items-center rounded-xl bg-slate-600 px-4 py-2 text-white font-medium shadow hover:bg-slate-700 transition">
                    Back to Measurements
                </a>
            </div>
        </div>

        <form th:action="@{/measurements/save}" method="post" class="space-y-6">
            <input type="hidden" name="id" th:value="${measurement.id}">

            <!-- Basic Information -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">Basic Information</h2>

                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Customer</label>
                        <select name="customerId" id="customerId" required
                                class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Select Customer</option>
                            <option th:each="customer : ${customers}"
                                    th:value="${customer.id}"
                                    th:text="${customer.name + ' (' + customer.gender + ')'}"
                                    th:attr="data-gender=${customer.gender}"
                                    th:selected="${measurement.customer != null and measurement.customer.id == customer.id}">
                            </option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Gender</label>
                        <input type="text" id="genderDisplay" readonly placeholder="Auto selected from customer"
                               class="w-full rounded-xl border border-slate-200 bg-slate-100 px-4 py-2.5 text-slate-700">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Measurement Type</label>
                        <select name="measurementType" id="measurementType"
                                class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Select Type</option>
                            <option value="Shirt" th:selected="${measurement.measurementType == 'Shirt'}">Shirt</option>
                            <option value="Pant" th:selected="${measurement.measurementType == 'Pant'}">Pant</option>
                            <option value="Blazer" th:selected="${measurement.measurementType == 'Blazer'}">Blazer</option>
                            <option value="Panjabi" th:selected="${measurement.measurementType == 'Panjabi'}">Panjabi</option>
                            <option value="Kameez" th:selected="${measurement.measurementType == 'Kameez'}">Kameez</option>
                            <option value="Blouse" th:selected="${measurement.measurementType == 'Blouse'}">Blouse</option>
                            <option value="Salwar" th:selected="${measurement.measurementType == 'Salwar'}">Salwar</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Common Measurements -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">Common Measurements</h2>

                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Shoulder</label>
                        <input type="number" step="0.01" name="shoulder" th:value="${measurement.shoulder}"
                               placeholder="0.00"
                               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Chest</label>
                        <input type="number" step="0.01" name="chest" th:value="${measurement.chest}"
                               placeholder="0.00"
                               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Waist</label>
                        <input type="number" step="0.01" name="waist" th:value="${measurement.waist}"
                               placeholder="0.00"
                               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Hip</label>
                        <input type="number" step="0.01" name="hip" th:value="${measurement.hip}"
                               placeholder="0.00"
                               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Sleeve Length</label>
                        <input type="number" step="0.01" name="sleeveLength" th:value="${measurement.sleeveLength}"
                               placeholder="0.00"
                               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Shirt Length</label>
                        <input type="number" step="0.01" name="shirtLength" th:value="${measurement.shirtLength}"
                               placeholder="0.00"
                               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Pant Length</label>
                        <input type="number" step="0.01" name="pantLength" th:value="${measurement.pantLength}"
                               placeholder="0.00"
                               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
            </div>

            <!-- Male Specific -->
            <div id="maleFields" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">Male Specific Measurements</h2>

                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Neck</label>
                        <input type="number" step="0.01" name="neck" th:value="${measurement.neck}"
                               placeholder="0.00"
                               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
            </div>

            <!-- Female Specific -->
            <div id="femaleFields" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">Female Specific Measurements</h2>

                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Bust</label>
                        <input type="number" step="0.01" name="bust" th:value="${measurement.bust}"
                               placeholder="0.00"
                               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Under Bust</label>
                        <input type="number" step="0.01" name="underBust" th:value="${measurement.underBust}"
                               placeholder="0.00"
                               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Front Neck Depth</label>
                        <input type="number" step="0.01" name="frontNeckDepth" th:value="${measurement.frontNeckDepth}"
                               placeholder="0.00"
                               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Back Neck Depth</label>
                        <input type="number" step="0.01" name="backNeckDepth" th:value="${measurement.backNeckDepth}"
                               placeholder="0.00"
                               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Armhole</label>
                        <input type="number" step="0.01" name="armhole" th:value="${measurement.armhole}"
                               placeholder="0.00"
                               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Kameez Length</label>
                        <input type="number" step="0.01" name="kameezLength" th:value="${measurement.kameezLength}"
                               placeholder="0.00"
                               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Salwar Length</label>
                        <input type="number" step="0.01" name="salwarLength" th:value="${measurement.salwarLength}"
                               placeholder="0.00"
                               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
            </div>

            <!-- Notes -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">Additional Notes</h2>

                <textarea name="notes" rows="5" th:text="${measurement.notes}"
                          placeholder="Special fitting instructions, style notes, measurement remarks..."
                          class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-3">
                <button type="submit"
                        class="rounded-xl bg-blue-600 px-6 py-2.5 text-white font-medium shadow hover:bg-blue-700 transition">
                    Save Measurement
                </button>

                <a th:href="@{/measurements}"
                   class="rounded-xl bg-slate-500 px-6 py-2.5 text-white font-medium shadow hover:bg-slate-600 transition">
                    Cancel
                </a>

                <a th:if="${measurement.id != null}"
                   th:href="@{/measurements/token/{id}(id=${measurement.id})}"
                   target="_blank" rel="noopener noreferrer"
                   class="rounded-xl bg-emerald-600 px-6 py-2.5 text-white font-medium shadow hover:bg-emerald-700 transition">
                    Generate Token
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    function updateGenderFields() {
        const customerSelect = document.getElementById("customerId");
        const selectedOption = customerSelect.options[customerSelect.selectedIndex];
        const gender = selectedOption ? selectedOption.getAttribute("data-gender") : "";

        document.getElementById("genderDisplay").value = gender ? gender : "";

        const maleFields = document.getElementById("maleFields");
        const femaleFields = document.getElementById("femaleFields");

        if (gender === "Female") {
            maleFields.classList.add("hidden");
            femaleFields.classList.remove("hidden");
        } else {
            maleFields.classList.remove("hidden");
            femaleFields.classList.add("hidden");
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        const customerSelect = document.getElementById("customerId");
        if (customerSelect) {
            customerSelect.addEventListener("change", updateGenderFields);
        }
        updateGenderFields();
    });
</script>

</body>
</html>
