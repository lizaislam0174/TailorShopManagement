<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="ml-64 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">

        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">Payment Form</h1>
                <p class="text-sm text-slate-500 mt-1">
                    Create and manage customer payments with order summary, due tracking, and receipt details.
                </p>
            </div>

            <div class="flex gap-3">
                <a th:if="${payment != null and payment.id != null}"
                   th:href="@{/payments/receipt/{id}(id=${payment.id})}"
                   class="inline-flex items-center rounded-xl bg-emerald-600 px-4 py-2 text-white font-medium shadow hover:bg-emerald-700 transition">
                    View Receipt
                </a>

                <a th:href="@{/payments}"
                   class="inline-flex items-center rounded-xl bg-slate-600 px-4 py-2 text-white font-medium shadow hover:bg-slate-700 transition">
                    Back to Payments
                </a>
            </div>
        </div>

        <form th:action="@{/payments/save}" method="post" class="space-y-6">
            <input type="hidden" name="id" th:value="${payment != null ? payment.id : ''}">

            <!-- Payment Information -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">Payment Information</h2>

                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">

                    <!-- Order -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Order</label>
                        <select name="orderId" id="orderId" required
                                class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Select Order</option>
                            <option th:each="order : ${orders}"
                                    th:value="${order.id}"
                                    th:text="${order.orderNo}"
                                    th:selected="${payment != null and payment.order != null and payment.order.id == order.id}"
                                    th:attr="data-total=${order.totalAmount},
                                             data-advance=${order.advanceAmount},
                                             data-due=${order.dueAmount}">
                            </option>
                        </select>
                    </div>

                    <!-- Amount -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Payment Amount</label>
                        <input type="number" step="0.01" name="amount" id="amount" required
                               th:value="${payment != null ? payment.amount : ''}"
                               placeholder="Enter payment amount"
                               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <!-- Payment Type -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Payment Type</label>
                        <select name="paymentType"
                                class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="CASH" th:selected="${payment != null and payment.paymentType != null and payment.paymentType.name() == 'CASH'}">Cash</option>
                            <option value="BKASH" th:selected="${payment != null and payment.paymentType != null and payment.paymentType.name() == 'BKASH'}">bKash</option>
                            <option value="NAGAD" th:selected="${payment != null and payment.paymentType != null and payment.paymentType.name() == 'NAGAD'}">Nagad</option>
                            <option value="CARD" th:selected="${payment != null and payment.paymentType != null and payment.paymentType.name() == 'CARD'}">Card</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Order Summary -->
            <div id="orderSummary" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">Order Summary</h2>

                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Total Amount</label>
                        <input type="text" id="totalAmountDisplay" readonly
                               class="w-full rounded-xl border border-slate-200 bg-slate-100 px-4 py-2.5 text-slate-700">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Advance / Paid</label>
                        <input type="text" id="paidAmountDisplay" readonly
                               class="w-full rounded-xl border border-slate-200 bg-slate-100 px-4 py-2.5 text-emerald-600 font-semibold">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Current Due</label>
                        <input type="text" id="dueAmountDisplay" readonly
                               class="w-full rounded-xl border border-slate-200 bg-slate-100 px-4 py-2.5 text-rose-600 font-semibold">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Remaining Due</label>
                        <input type="text" id="remainingDue" readonly
                               class="w-full rounded-xl border border-slate-200 bg-slate-100 px-4 py-2.5 text-rose-600 font-semibold"
                               value="0.00">
                    </div>
                </div>
            </div>

            <!-- Note -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">Additional Notes</h2>

                <textarea name="note" rows="5"
                          class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                          placeholder="Optional payment note, transaction details, or remarks..."
                          th:text="${payment != null ? payment.note : ''}"></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-3">
                <button type="submit"
                        class="rounded-xl bg-blue-600 px-6 py-2.5 text-white font-medium shadow hover:bg-blue-700 transition">
                    Save Payment
                </button>

                <a th:href="@{/payments}"
                   class="rounded-xl bg-slate-500 px-6 py-2.5 text-white font-medium shadow hover:bg-slate-600 transition">
                    Cancel
                </a>

                <a th:if="${payment != null and payment.id != null}"
                   th:href="@{/payments/receipt/{id}(id=${payment.id})}"
                   class="rounded-xl bg-emerald-600 px-6 py-2.5 text-white font-medium shadow hover:bg-emerald-700 transition">
                    Generate Receipt
                </a>

                <a th:if="${payment != null and payment.id != null}"
                   th:href="@{/payments/voucher/{id}(id=${payment.id})}"
                   class="rounded-xl bg-violet-600 px-6 py-2.5 text-white font-medium shadow hover:bg-violet-700 transition">
                    Receive Voucher
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    const orderSelect = document.getElementById("orderId");
    const amountInput = document.getElementById("amount");
    const orderSummary = document.getElementById("orderSummary");

    function formatMoney(value) {
        return Number(value || 0).toFixed(2);
    }

    function updateSummary() {
        const selectedOption = orderSelect.options[orderSelect.selectedIndex];

        if (!selectedOption || !selectedOption.value) {
            orderSummary.classList.add("hidden");
            document.getElementById("totalAmountDisplay").value = "0.00";
            document.getElementById("paidAmountDisplay").value = "0.00";
            document.getElementById("dueAmountDisplay").value = "0.00";
            document.getElementById("remainingDue").value = "0.00";
            return;
        }

        const total = parseFloat(selectedOption.getAttribute("data-total")) || 0;
        const advance = parseFloat(selectedOption.getAttribute("data-advance")) || 0;
        const due = parseFloat(selectedOption.getAttribute("data-due")) || 0;
        const enteredAmount = parseFloat(amountInput.value) || 0;
        const remaining = due - enteredAmount;

        orderSummary.classList.remove("hidden");

        document.getElementById("totalAmountDisplay").value = formatMoney(total);
        document.getElementById("paidAmountDisplay").value = formatMoney(advance);
        document.getElementById("dueAmountDisplay").value = formatMoney(due);
        document.getElementById("remainingDue").value = formatMoney(remaining < 0 ? 0 : remaining);
    }

    orderSelect.addEventListener("change", updateSummary);
    amountInput.addEventListener("input", updateSummary);

    document.addEventListener("DOMContentLoaded", updateSummary);
</script>

</body>
</html>
