<div th:fragment="sidebar">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .sidebar-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-scroll::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.4);
            border-radius: 9999px;
        }
    </style>

    <!-- Toggle Button -->
    <button id="sidebarToggle"
            type="button"
            class="fixed top-4 left-4 z-50 inline-flex items-center justify-center w-11 h-11 rounded-xl bg-slate-800 text-white shadow-lg hover:bg-slate-700 transition-all duration-300">
        <svg id="menuOpenIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 block" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <svg id="menuCloseIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
    </button>

    <!-- Backdrop -->
    <div id="sidebarBackdrop"
         class="fixed inset-0 bg-black/40 z-30 hidden lg:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar"
           class="fixed top-0 left-0 z-40 h-screen w-64 bg-slate-900 text-white shadow-2xl transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col">

        <!-- Brand -->
        <div class="h-20 px-16 flex items-center border-b border-white/10">
            <div class="flex items-center gap-3">
<!--                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-lg">-->
<!--                    T-->
<!--                </div>-->
                <div id="brandText" class="transition-all duration-300">
                    <h2 class="text-lg font-bold leading-tight tracking-wide">Tailor Shop</h2>
                    <p class="text-xs text-slate-400">Management System</p>
                </div>
            </div>
        </div>

        <!-- Nav -->
        <nav class="flex-1 overflow-y-auto sidebar-scroll px-3 py-4 space-y-2">

            <a th:href="@{/}"
               class="group flex items-center gap-3 px-4 py-3 rounded-xl text-slate-200 hover:bg-slate-800 hover:text-white transition-all duration-200">
                <span class="text-lg">🏠</span>
                <span class="sidebar-label">Dashboard</span>
            </a>

            <a th:href="@{/customers}"
               class="group flex items-center gap-3 px-4 py-3 rounded-xl text-slate-200 hover:bg-slate-800 hover:text-white transition-all duration-200">
                <span class="text-lg">👤</span>
                <span class="sidebar-label">Customers</span>
            </a>

            <a th:href="@{/employees}"
               class="group flex items-center gap-3 px-4 py-3 rounded-xl text-slate-200 hover:bg-slate-800 hover:text-white transition-all duration-200">
                <span class="text-lg">🧵</span>
                <span class="sidebar-label">Employees</span>
            </a>

            <a th:href="@{/measurements}"
               class="group flex items-center gap-3 px-4 py-3 rounded-xl text-slate-200 hover:bg-slate-800 hover:text-white transition-all duration-200">
                <span class="text-lg">📏</span>
                <span class="sidebar-label">Measurements</span>
            </a>

            <a th:href="@{/orders}"
               class="group flex items-center gap-3 px-4 py-3 rounded-xl text-slate-200 hover:bg-slate-800 hover:text-white transition-all duration-200">
                <span class="text-lg">📦</span>
                <span class="sidebar-label">Orders</span>
            </a>

            <a th:href="@{/payments}"
               class="group flex items-center gap-3 px-4 py-3 rounded-xl text-slate-200 hover:bg-slate-800 hover:text-white transition-all duration-200">
                <span class="text-lg">💳</span>
                <span class="sidebar-label">Payments</span>
            </a>
        </nav>

        <!-- Footer -->
        <div class="p-4 border-t border-white/10">
            <div class="rounded-xl bg-slate-800 px-4 py-3">
                <p class="text-sm font-medium">Sun Moon Tailor</p>
                <p class="text-xs text-slate-400">Admin Panel</p>
                <a th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </aside>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const sidebar = document.getElementById("sidebar");
            const toggleBtn = document.getElementById("sidebarToggle");
            const backdrop = document.getElementById("sidebarBackdrop");
            const openIcon = document.getElementById("menuOpenIcon");
            const closeIcon = document.getElementById("menuCloseIcon");

            let isMobileOpen = false;

            function updateIcons() {
                if (isMobileOpen) {
                    openIcon.classList.add("hidden");
                    closeIcon.classList.remove("hidden");
                } else {
                    openIcon.classList.remove("hidden");
                    closeIcon.classList.add("hidden");
                }
            }

            function openSidebar() {
                sidebar.classList.remove("-translate-x-full");
                backdrop.classList.remove("hidden");
                isMobileOpen = true;
                updateIcons();
            }

            function closeSidebar() {
                if (window.innerWidth < 1024) {
                    sidebar.classList.add("-translate-x-full");
                    backdrop.classList.add("hidden");
                    isMobileOpen = false;
                    updateIcons();
                }
            }

            toggleBtn.addEventListener("click", function () {
                if (window.innerWidth < 1024) {
                    if (isMobileOpen) {
                        closeSidebar();
                    } else {
                        openSidebar();
                    }
                } else {
                    // Desktop collapse / expand
                    sidebar.classList.toggle("w-64");
                    sidebar.classList.toggle("w-20");

                    document.querySelectorAll(".sidebar-label").forEach(el => {
                        el.classList.toggle("hidden");
                    });

                    const brandText = document.getElementById("brandText");
                    brandText.classList.toggle("hidden");
                }
            });

            backdrop.addEventListener("click", closeSidebar);

            window.addEventListener("resize", function () {
                if (window.innerWidth >= 1024) {
                    sidebar.classList.remove("-translate-x-full");
                    backdrop.classList.add("hidden");
                    isMobileOpen = false;
                    updateIcons();
                } else {
                    sidebar.classList.add("-translate-x-full");
                    isMobileOpen = false;
                    updateIcons();
                }
            });
        });
    </script>
</div>
